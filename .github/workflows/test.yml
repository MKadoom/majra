name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: majra
          POSTGRES_PASSWORD: majra
          POSTGRES_DB: majra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U majra"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      MAJRA_DATABASE_URL: postgresql+psycopg://majra:majra@localhost:5432/majra_test
      MAJRA_ENVIRONMENT: test
      MAJRA_REDIS_URL: redis://localhost:6379/0
      MAJRA_RATE_LIMIT_ENABLED: "false"
      MAJRA_SECRET_KEY: ci-secret
      MAJRA_ENCRYPTION_KEY: ci-encryption-key-please-rotate
      MAJRA_META_APP_ID: "123456"
      MAJRA_META_APP_SECRET: shh
      MAJRA_PUBLIC_BASE_URL: http://testserver

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyarrow  # optional parquet export dep (keeps that test from skipping)
      - name: Run tests
        run: python -m pytest -q
