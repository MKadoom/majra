name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    # The suite runs against a real Postgres, not a mock — the sync engine's
    # whole contract (delete+insert idempotency, watermarks) is SQL behaviour.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: majra
          POSTGRES_PASSWORD: majra
          POSTGRES_DB: majra_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U majra"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install ruff pyarrow  # pyarrow: exercises the optional parquet export test

      - name: Lint
        working-directory: backend
        run: ruff check .

      - name: Test
        working-directory: backend
        env:
          MAJRA_ENVIRONMENT: test
          MAJRA_DATABASE_URL: postgresql+psycopg://majra:majra@localhost:5432/majra_test
        run: python -m pytest -q

      - name: Migrations must be reversible
        working-directory: backend
        env:
          MAJRA_DATABASE_URL: postgresql+psycopg://majra:majra@localhost:5432/majra_test
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npm run build
