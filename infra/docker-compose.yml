name: majra

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${MAJRA_PG_USER:-majra}
      POSTGRES_PASSWORD: ${MAJRA_PG_PASSWORD:-majra}
      POSTGRES_DB: ${MAJRA_PG_DB:-majra}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MAJRA_PG_USER:-majra}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ../backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: ../.env
    environment:
      MAJRA_DATABASE_URL: postgresql+psycopg://${MAJRA_PG_USER:-majra}:${MAJRA_PG_PASSWORD:-majra}@postgres:5432/${MAJRA_PG_DB:-majra}
      MAJRA_REDIS_URL: redis://redis:6379/0
    volumes:
      - ../backend:/app
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if 'true' in urllib.request.urlopen('http://localhost:8000/health').read().decode() else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ../backend
    command: celery -A app.workers.tasks.celery_app worker --loglevel=info
    env_file: ../.env
    environment:
      MAJRA_DATABASE_URL: postgresql+psycopg://${MAJRA_PG_USER:-majra}:${MAJRA_PG_PASSWORD:-majra}@postgres:5432/${MAJRA_PG_DB:-majra}
      MAJRA_REDIS_URL: redis://redis:6379/0
    volumes:
      - ../backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: ../backend
    command: celery -A app.workers.tasks.celery_app beat --loglevel=info
    env_file: ../.env
    environment:
      MAJRA_DATABASE_URL: postgresql+psycopg://${MAJRA_PG_USER:-majra}:${MAJRA_PG_PASSWORD:-majra}@postgres:5432/${MAJRA_PG_DB:-majra}
      MAJRA_REDIS_URL: redis://redis:6379/0
    volumes:
      - ../backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ../frontend
    environment:
      # The Next.js server talks to the backend over the compose network; the
      # browser only ever talks to Next (via /api/proxy), so the backend needs
      # no CORS and no token is exposed to client-side JavaScript.
      MAJRA_API_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
